name: Build Azelux Java 26.2

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Azelux
        run: gradle build --stacktrace --no-daemon

      - name: Upload build output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: azelux-java-26.2-build
          path: |
            build/libs/*.jar
            build/reports/
          if-no-files-found: warn
          retention-days: 14
